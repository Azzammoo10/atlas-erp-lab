name: T01 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: PostgreSQL integration tests and backend package
        working-directory: backend
        run: ./mvnw -B verify
      - name: Full Compose and browser verification
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 180
          cd frontend
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://127.0.0.1:8081 npm run test:e2e
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services while preserving data
        if: always()
        run: docker compose down
